name: Auto Unzip
on: push
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and Push
        run: |
          unzip -o archive.zip -x ".github/*"
          rm archive.zip
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Force Extracted NEW project files safely"
          git push
