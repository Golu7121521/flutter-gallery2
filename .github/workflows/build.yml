name: Build Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create android/local.properties
        run: |
          FLUTTER_BIN="$(which flutter)"
          FLUTTER_ROOT_DIR="$(dirname "$(dirname "$FLUTTER_BIN")")"
          {
            echo "flutter.sdk=$FLUTTER_ROOT_DIR"
            echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          } > android/local.properties
          echo "Generated android/local.properties:"
          cat android/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14'

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.14 --distribution-type all

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project (non-blocking)
        run: flutter analyze || true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gallery-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

