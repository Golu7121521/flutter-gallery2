plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0.0"

android {
    namespace "com.gallery"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.gallery"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // Only build/package the arm64-v8a native libraries (used by
        // virtually all modern Android phones). This alone removes the
        // armeabi-v7a/x86/x86_64 copies of media_kit's bundled libmpv
        // native libraries, which are the single biggest contributor to
        // APK size in this project.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            // Strips unused Java/Kotlin code and unused resources from the
            // final APK to further cut down size.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // `defaultConfig.ndk.abiFilters` above only controls ABIs for code
    // actually compiled via the NDK in this project. Third-party AARs
    // (e.g. media_kit_libs_video, which bundles prebuilt libmpv .so files
    // for arm64-v8a/armeabi-v7a/x86_64) ship their own native libraries
    // that bypass that filter. This packagingOptions block explicitly
    // strips every non-arm64-v8a native library from the final APK,
    // regardless of which dependency it came from.
    packagingOptions {
        jniLibs {
            excludes += [
                "lib/armeabi-v7a/**",
                "lib/x86/**",
                "lib/x86_64/**"
            ]
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.20"
    // Required so Theme.AppCompat.* resolves for image_cropper's native
    // UCropActivity (declared in AndroidManifest.xml).
    implementation "androidx.appcompat:appcompat:1.7.0"
}
